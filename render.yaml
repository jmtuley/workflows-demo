# G5 (b): the only shape that can reach the plan-time scoping check.
# wf-shared already exists in prod (created by G4). wf-crosslink is NEW, lives
# in staging, and links to it. Create path + pre-existing group.
projects:
  - name: wf-project
    environments:
      - name: staging
        services:
          - type: workflow
            name: wf-crosslink
            runtime: node
            region: oregon
            startCommand: npm start
            envVars:
              - fromGroup: wf-shared
