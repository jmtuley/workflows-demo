# I6b: the cross-section variant. One wf-dupe ungrouped, one under a project
# environment. Tests whether RecursiveWorkflows walks both sections.
services:
  - type: workflow
    name: wf-dupe
    runtime: node
    region: oregon
    startCommand: npm start
projects:
  - name: wf-project
    environments:
      - name: prod
        services:
          - type: workflow
            name: wf-dupe
            runtime: node
            region: oregon
            startCommand: npm run other
