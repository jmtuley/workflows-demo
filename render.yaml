# G5: group lives in prod, workflow lives in staging. Expect
#   workflow can only link to env group "wf-shared" if it's in the same "prod" environment
projects:
  - name: wf-project
    environments:
      - name: prod
        envVarGroups:
          - name: wf-shared
            envVars:
              - key: SHARED
                value: yes
      - name: staging
        services:
          - type: workflow
            name: wf-minimal
            runtime: node
            region: oregon
            startCommand: npm start
            envVars:
              - fromGroup: wf-shared
