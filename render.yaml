# B4 control: a web service and no workflow at all. If this sync's card renders
# "Create web service wf-control" but the workflow-only sync renders blank, the
# blank is specific to workflow actions rather than a broken PlanView.
services:
  - type: web
    name: wf-control
    runtime: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
