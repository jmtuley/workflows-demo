# G5 (a): a NEW group in prod, workflow in staging, linked with fromGroup.
# This is the documented path: the link is being added, not pre-existing.
projects:
  - name: wf-project
    environments:
      - name: prod
        envVarGroups:
          - name: wf-shared2
            envVars:
              - key: SHARED
                value: yes
      - name: staging
        services:
          - type: workflow
            name: wf-minimal
            runtime: node
            region: oregon
            startCommand: npm start
            envVars:
              - fromGroup: wf-shared2
