# D3: add two env vars to the existing workflow.
services:
  - type: workflow
    name: wf-minimal
    runtime: node
    region: oregon
    buildCommand: npm ci
    startCommand: npm run worker
    rootDir: src
    autoDeploy: "off"
    envVars:
      - key: FIRST
        value: one
      - key: SECOND
        value: two
