# G3b: wf-minimal declared top-level with neither `ungrouped` nor
# project/environment, while the live workflow sits in wf-project / prod.
# The planner should only propose a move when `ungrouped` is true or both
# project and environment are set, so this half-specified location must be a
# no-op rather than an accidental move out of the environment.
services:
  - type: workflow
    name: wf-minimal
    runtime: node
    region: oregon
    startCommand: npm start
