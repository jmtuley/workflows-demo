# E3 (control for E2): same block as 37 but with a changed startCommand, so the
# capture rides alongside a genuine run-command diff.
# wrapper UpdateWorkflow carries a real field change. Expect TWO rendered lines.
services:
  - type: workflow
    name: wf-capture
    runtime: node
    region: oregon
    buildCommand: npm install
    startCommand: npm run other
    autoDeploy: commit
