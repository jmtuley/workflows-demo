# B1 happy path: the smallest legal type: workflow block.
# repo: omitted on purpose so it falls back to the Blueprint's connected repo.
services:
  - type: workflow
    name: wf-minimal
    runtime: node
    region: oregon
    startCommand: npm start
    envVars:
      - key: LOG_LEVEL
        value: info
      - fromGroup: demo-shared
      - key: CH_CH_CHANGES
        value: stay-the-same
  - type: workflow
    name: wild-workflow
    runtime: node
    region: oregon
    branch: master
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LOG_LEVEL
        value: info
      - fromGroup: demo-shared
      - key: CAPTURED
        value: true

envVarGroups:
  - name: demo-shared
    envVars:
      - key: FEATURE_FLAG
        value: "true"
