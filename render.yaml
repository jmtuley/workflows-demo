# I2: the Workflow struct has no Plan field, unlike Service. Verified locally to
# be REJECTED, not dropped: the spec decoder runs KnownFields(true) and that
# survives into the product unmarshaller, so expect
#   field plan not found in type file.Workflow
services:
  - type: workflow
    name: wf-minimal
    runtime: node
    region: oregon
    startCommand: npm start
    plan: starter
