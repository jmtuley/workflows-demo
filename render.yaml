# I6a: two workflow blocks in one spec sharing the name wf-dupe, both in the
# same top-level section. Expect a uniqueness error, not two creates.
services:
  - type: workflow
    name: wf-dupe
    runtime: node
    region: oregon
    startCommand: npm start
  - type: workflow
    name: wf-dupe
    runtime: node
    region: oregon
    startCommand: npm run other
