# B2: every field the Workflow struct supports.
services:
  - type: workflow
    name: wf-full
    runtime: node
    repo: https://github.com/jmtuley/workflows-demo
    branch: master
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    rootDir: .
    autoDeploy: commit
    buildFilter:
      paths:
        - src/**
      ignoredPaths:
        - README.md
    envVars:
      - key: PLAIN
        value: hello
      - key: GENERATED
        generateValue: true
