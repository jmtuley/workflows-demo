# E2 (visual re-run on the deployed dashboard): matches wf-capture exactly as
# the CLI created it, so the ONLY action is the capture and the wrapper
# UpdateWorkflow carries no field changes. Expect one rendered line.
services:
  - type: workflow
    name: wf-capture
    runtime: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: commit
