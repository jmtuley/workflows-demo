# I8: runtime: docker on a workflow, with a startCommand present. Workflow.Validate
# checks the runtime only against Render's full runtime list and applies none of
# the per-runtime rules a service gets, so the non-native ones are expected to
# pass. Only an unknown runtime should fail.
services:
  - type: workflow
    name: wf-rt-docker
    runtime: docker
    region: oregon
    startCommand: npm start
