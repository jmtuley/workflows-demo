# C7: a web service and a workflow sharing one name. Name uniqueness is only
# enforced when the flag is ON, so this is also a flag-gating probe.
services:
  - type: web
    name: wf-collide
    runtime: node
    buildCommand: npm install
    startCommand: npm start
  - type: workflow
    name: wf-collide
    runtime: node
    region: oregon
    startCommand: npm start
