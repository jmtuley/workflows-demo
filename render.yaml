# J (production side): what master declares once the preview test is set up.
# The workflow's startCommand is `npm run production-marker` here, while the PR
# branch will declare `npm run preview-marker`. The two MUST differ: if both
# sides declared the same command, a preview leaking into the production
# workflow would be indistinguishable from nothing happening at all, and J2
# would silently pass whatever the truth was.
#
# Isolated variant of fixture 24: uses a dedicated wf-preview rather than
# wf-minimal.
#
# Two reasons. wf-minimal currently sits in wf-project/prod with wf-shared
# linked, which adds environment and env-group behavior to a test that is about
# the preview rename step alone. And if J2 fails, meaning the preview does
# mutate production, the damage lands on a throwaway workflow instead of the
# resource phases D through G were verified against.
#
# Original header follows.
# J: previews enabled with a workflow block, for the preview-environment phase.
# spectransform's renameResources suffixes services, databases, redises, env
# groups and artifact sources for a PR preview, but never workflows, so the
# block below keeps its production name inside the preview. The startCommand
# is a marker value so a leak into the production workflow is visible.
previews:
  generation: automatic
services:
  - type: web
    name: wf-companion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
  - type: workflow
    name: wf-preview
    runtime: node
    region: oregon
    startCommand: npm run production-marker
