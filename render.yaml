# I3: same as 22 for a batch of service-only fields. All three were verified
# rejected individually. Use this one to see whether the decoder reports every
# offending key at once or stops at the first.
services:
  - type: workflow
    name: wf-minimal
    runtime: node
    region: oregon
    startCommand: npm start
    numInstances: 3
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
