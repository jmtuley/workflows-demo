services:
  - type: workflow
    name: demo-workflow
    runtime: node
    region: virginia
    branch: master
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LOG_LEVEL
        value: info
      - fromGroup: demo-shared

envVarGroups:
  - name: demo-shared
    envVars:
      - key: FEATURE_FLAG
        value: "true"
