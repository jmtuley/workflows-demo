# D4: FIRST and SECOND removed from the spec. The planner only ever emits
# EnvVarsToCreate / EnvVarsToUpdate / EnvGroupsToAdd, so removal is expected to
# be a NO-OP. Confirm the vars survive on the live workflow.
services:
  - type: workflow
    name: wf-minimal
    runtime: node
    region: oregon
    buildCommand: npm ci
    startCommand: npm run worker
    rootDir: src
    autoDeploy: "off"
