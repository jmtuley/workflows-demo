# I4: wf-race renamed to wf-renamed. Identity is the name, so expect a CREATE of
# wf-renamed rather than a rename, and wf-race left orphaned.
# (Uses wf-race rather than wf-minimal so phase G's environment setup survives.)
services:
  - type: workflow
    name: wf-renamed
    runtime: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: commit
