# G4 happy path: workflow and env group in the same environment.
projects:
  - name: wf-project
    environments:
      - name: prod
        envVarGroups:
          - name: wf-shared
            envVars:
              - key: SHARED
                value: yes
        services:
          - type: workflow
            name: wf-minimal
            runtime: node
            region: oregon
            startCommand: npm start
            envVars:
              - fromGroup: wf-shared
